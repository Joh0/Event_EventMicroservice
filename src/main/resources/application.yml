server:
  port: 8080
spring:
  application:
    name: event
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3306/eventmicroservicedb?createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
